<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Консьерж-помощник</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }

    header .logo { font-size: 26px; }
    header h1 { font-size: 18px; font-weight: 600; }
    header p { font-size: 12px; color: #a0a8c0; margin-top: 2px; }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    /* ── Chat ── */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #1a1a2e;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: #f0f2f5;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }

    .msg.typing {
      color: #888;
      font-style: italic;
    }

    .chat-input-bar {
      padding: 16px 24px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
      background: #fff;
    }

    .chat-input-bar input {
      flex: 1;
      border: 1.5px solid #d1d5db;
      border-radius: 24px;
      padding: 10px 18px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }

    .chat-input-bar input:focus { border-color: #1a1a2e; }

    .chat-input-bar button {
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 10px 22px;
      font-size: 14px;
      cursor: pointer;
      transition: opacity .2s;
    }

    .chat-input-bar button:disabled { opacity: .5; cursor: default; }

    /* Suggestions */
    .suggestions {
      display: flex;
      gap: 8px;
      padding: 0 24px 14px;
      flex-wrap: wrap;
    }

    .suggestions button {
      background: #fff;
      border: 1.5px solid #d1d5db;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      color: #374151;
      transition: border-color .2s, background .2s;
    }

    .suggestions button:hover {
      border-color: #1a1a2e;
      background: #f0f2f5;
    }

    /* ── Cart ── */
    .cart-panel {
      width: 320px;
      background: #fff;
      border-left: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
    }

    .cart-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cart-header h2 { font-size: 16px; font-weight: 600; }

    .cart-header button {
      background: none;
      border: none;
      font-size: 12px;
      color: #ef4444;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background .2s;
    }

    .cart-header button:hover { background: #fee2e2; }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cart-empty {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      padding: 40px 0;
    }

    .cart-item {
      background: #f9fafb;
      border-radius: 12px;
      padding: 10px 14px;
    }

    .cart-item .item-name {
      font-size: 13px;
      font-weight: 500;
      color: #111827;
      margin-bottom: 4px;
    }

    .cart-item .item-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #6b7280;
    }

    .cart-item .item-price {
      font-weight: 600;
      color: #1a1a2e;
    }

    .cart-footer {
      padding: 16px 20px;
      border-top: 1px solid #e5e7eb;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 14px;
    }

    .btn-checkout {
      width: 100%;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }

    .btn-checkout:hover { background: #15803d; }
    .btn-checkout:disabled { background: #9ca3af; cursor: default; }

    @media (max-width: 640px) {
      .cart-panel { display: none; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo">🛒</span>
  <div>
    <h1>Консьерж-помощник</h1>
    <p>Опишите, что хотите — подберём и добавим в корзину</p>
  </div>
</header>

<div class="layout">
  <!-- Chat -->
  <div class="chat-panel">
    <div class="messages" id="messages">
      <div class="msg bot">Привет! Я помогу вам собрать корзину. Просто напишите, что вам нужно — например:<br><br>
        «Собери безлактозный завтрак до 1500 руб» или<br>
        «Нужны продукты для овсяной каши»</div>
    </div>

    <div class="suggestions">
      <button onclick="suggest('Собери безлактозный завтрак до 1500 руб')">🥛 Безлактозный завтрак до 1500 ₽</button>
      <button onclick="suggest('Хочу веганский завтрак до 800 рублей')">🌱 Веганский завтрак до 800 ₽</button>
      <button onclick="suggest('Подбери продукты для полезного завтрака с яйцами')">🥚 Завтрак с яйцами</button>
      <button onclick="suggest('Что можно купить для перекуса до 500 руб?')">🥗 Перекус до 500 ₽</button>
    </div>

    <div class="chat-input-bar">
      <input id="msgInput" type="text" placeholder="Напишите запрос…" onkeydown="handleKey(event)" />
      <button id="sendBtn" onclick="sendMessage()">Отправить</button>
    </div>
  </div>

  <!-- Cart -->
  <div class="cart-panel">
    <div class="cart-header">
      <h2>🛍 Корзина</h2>
      <button onclick="clearCart()">Очистить</button>
    </div>
    <div class="cart-items" id="cartItems">
      <div class="cart-empty">Корзина пуста</div>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Итого</span>
        <span id="cartTotal">0 ₽</span>
      </div>
      <button class="btn-checkout" id="checkoutBtn" disabled onclick="checkout()">Оформить заказ</button>
    </div>
  </div>
</div>

<script>
  const API = '';
  let sessionId = localStorage.getItem('sessionId') || null;

  function suggest(text) {
    document.getElementById('msgInput').value = text;
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter') sendMessage();
  }

  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    appendMessage('user', text);

    const typingEl = appendMessage('bot', '⏳ Подбираю товары…', true);
    setLoading(true);

    try {
      const res = await fetch(`${API}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      const data = await res.json();
      sessionId = data.session_id;
      localStorage.setItem('sessionId', sessionId);

      typingEl.remove();
      appendMessage('bot', data.reply);
      renderCart(data.cart);
    } catch (e) {
      typingEl.remove();
      appendMessage('bot', '❌ Ошибка соединения с сервером.');
    } finally {
      setLoading(false);
    }
  }

  function appendMessage(role, text, isTyping = false) {
    const el = document.createElement('div');
    el.className = `msg ${role}${isTyping ? ' typing' : ''}`;
    el.textContent = text;
    const container = document.getElementById('messages');
    container.appendChild(el);
    container.scrollTop = container.scrollHeight;
    return el;
  }

  function setLoading(on) {
    document.getElementById('sendBtn').disabled = on;
    document.getElementById('msgInput').disabled = on;
  }

  function renderCart(cart) {
    const container = document.getElementById('cartItems');
    const totalEl = document.getElementById('cartTotal');
    const checkoutBtn = document.getElementById('checkoutBtn');

    if (!cart.items || cart.items.length === 0) {
      container.innerHTML = '<div class="cart-empty">Корзина пуста</div>';
      totalEl.textContent = '0 ₽';
      checkoutBtn.disabled = true;
      return;
    }

    container.innerHTML = cart.items.map(item => `
      <div class="cart-item">
        <div class="item-name">${item.name}</div>
        <div class="item-meta">
          <span>${item.quantity} × ${item.price} ₽</span>
          <span class="item-price">${item.subtotal} ₽</span>
        </div>
      </div>
    `).join('');

    totalEl.textContent = `${cart.total} ₽`;
    checkoutBtn.disabled = false;
  }

  async function clearCart() {
    if (!sessionId) return;
    await fetch(`${API}/api/cart/${sessionId}`, { method: 'DELETE' });
    sessionId = null;
    localStorage.removeItem('sessionId');
    renderCart({ items: [], total: 0 });
    appendMessage('bot', '🗑 Корзина очищена. Начнём сначала?');
  }

  function checkout() {
    alert('Заказ оформлен! В реальном приложении здесь был бы переход к оплате.');
  }

  // Load cart on page open
  async function loadCart() {
    if (!sessionId) return;
    try {
      const res = await fetch(`${API}/api/cart/${sessionId}`);
      const cart = await res.json();
      renderCart(cart);
    } catch (_) {}
  }

  loadCart();
</script>
</body>
</html>
